<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="mckBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#001e38"/>
      <stop offset="100%" stop-color="#08294a"/>
    </linearGradient>
    <linearGradient id="starWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <!-- Base rounded container -->
  <rect width="64" height="64" rx="14" fill="url(#mckBg)"/>
  <rect x="1" y="1" width="62" height="62" rx="13" fill="none" stroke="#255178" stroke-width="1.5" stroke-opacity="0.8"/>

  <!-- McKinsey 4-point star-cross emblem -->
  <g transform="translate(32, 32)">
    <!-- Vertical blade -->
    <path d="M 0,-21 C 2.5,-12 5,-5 13,0 C 5,5 2.5,12 0,21 C -2.5,12 -5,5 -13,0 C -5,-5 -2.5,-12 0,-21 Z" fill="url(#starWhite)"/>
    <!-- Horizontal blade -->
    <path d="M -21,0 C -12,2.5 -5,5 0,13 C 5,5 12,2.5 21,0 C 12,-2.5 5,-5 0,-13 C -5,-5 -12,-2.5 -21,0 Z" fill="url(#starWhite)"/>
    
    <!-- Central diamond -->
    <polygon points="0,-4.5 4.5,0 0,4.5 -4.5,0" fill="url(#cyanGlow)"/>

    <!-- Diagonal accent pips -->
    <circle cx="-10.5" cy="-10.5" r="1.8" fill="#38bdf8" opacity="0.9"/>
    <circle cx="10.5" cy="-10.5" r="1.8" fill="#38bdf8" opacity="0.9"/>
    <circle cx="-10.5" cy="10.5" r="1.8" fill="#38bdf8" opacity="0.9"/>
    <circle cx="10.5" cy="10.5" r="1.8" fill="#38bdf8" opacity="0.9"/>
  </g>
</svg>
