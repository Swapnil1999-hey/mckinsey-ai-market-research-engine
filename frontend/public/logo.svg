<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 64" width="260" height="64">
  <defs>
    <linearGradient id="logoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#001e38"/>
      <stop offset="100%" stop-color="#08294a"/>
    </linearGradient>
    <linearGradient id="starWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <!-- Left Icon Emblem -->
  <g transform="translate(6, 6)">
    <rect width="52" height="52" rx="12" fill="url(#logoBg)"/>
    <rect x="1" y="1" width="50" height="50" rx="11" fill="none" stroke="#255178" stroke-width="1.2"/>
    <g transform="translate(26, 26)">
      <path d="M 0,-17 C 2,-10 4,-4 10,0 C 4,4 2,10 0,17 C -2,10 -4,4 -10,0 C -4,-4 -2,-10 0,-17 Z" fill="url(#starWhite)"/>
      <path d="M -17,0 C -10,2 -4,4 0,10 C 4,4 10,2 17,0 C 10,-2 4,-4 0,-10 C -4,-4 -10,-2 -17,0 Z" fill="url(#starWhite)"/>
      <polygon points="0,-3.5 3.5,0 0,3.5 -3.5,0" fill="url(#cyanGlow)"/>
      <circle cx="-8.5" cy="-8.5" r="1.4" fill="#38bdf8" opacity="0.9"/>
      <circle cx="8.5" cy="-8.5" r="1.4" fill="#38bdf8" opacity="0.9"/>
      <circle cx="-8.5" cy="8.5" r="1.4" fill="#38bdf8" opacity="0.9"/>
      <circle cx="8.5" cy="8.5" r="1.4" fill="#38bdf8" opacity="0.9"/>
    </g>
  </g>

  <!-- Wordmark -->
  <text x="68" y="28" font-family="'Georgia', 'Times New Roman', serif" font-size="18" font-weight="700" fill="#001e38" letter-spacing="-0.2">McKinsey</text>
  <text x="68" y="46" font-family="'Georgia', 'Times New Roman', serif" font-size="15" font-style="italic" fill="#0a3962" letter-spacing="0.2">&amp; Company</text>
  <text x="168" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#0284c7" letter-spacing="1.2">STRATEGY AI</text>
</svg>
